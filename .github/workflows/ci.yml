name: CI

on:
  push:
  pull_request:

jobs:
  lint-typecheck-test:
    name: lint-typecheck-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deliberately NOT caching node_modules or the Vite/Vitest cache: we want a
      # genuinely cold cache so the run exercises the jsdom cold-start fix
      # (lucide-react pre-bundling + jsdom suite isolation).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
